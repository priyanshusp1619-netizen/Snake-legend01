
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNAKE LEGEND</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080b16;
  color: #00ffcc;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px 12px;
}
h1 {
  color: #00ffcc;
  text-shadow: 0 0 15px #00ffcc;
}
#score { font-size: 20px; margin: 12px; }
canvas {
  background: #10182b;
  border: 2px solid #00ffcc;
  box-shadow: 0 0 18px #00ffcc55;
  width: min(90vw, 360px);
  height: min(90vw, 360px);
  touch-action: none;
}
button {
  background: #10182b;
  color: #00ffcc;
  border: 1px solid #00ffcc;
  border-radius: 10px;
  padding: 14px 20px;
  margin: 5px;
  font-size: 20px;
}
.controls {
  display: grid;
  grid-template-columns: repeat(3, 65px);
  justify-content: center;
  gap: 5px;
  margin-top: 15px;
}
.controls button { margin: 0; }
  #startScreen {
  display: none;
  }
  #startScreen {
  display: block;
  }
</style>
</head>
<body>
<div id="startScreen">
  
  <p>Eat • Grow • Survive</p>
  <p>Use buttons to control your snake!</p>
  <button onclick="startGame()">🚀 PLAY NOW</button>
</div>
<h1>🐍 SNAKE LEGEND</h1>
<div id="score">Score: 0</div>
  <div id="level">Level: 1</div>
  <div id="best">Best: 0</div>

<canvas id="game" width="360" height="360"></canvas>

<div class="controls">
  <span></span><button onclick="move(0,-1)">⬆️</button><span></span>
  <button onclick="move(-1,0)">⬅️</button>
  <button onclick="move(0,1)">⬇️</button>
  <button onclick="move(1,0)">➡️</button>
</div>

<p id="message">Press Start to Play!</p>
<button onclick="startGame()">▶ Start / Restart</button>
  <button onclick="pauseGame()">⏸ Pause / Resume</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
  const audio = new (window.AudioContext || window.webkitAudioContext)();

function playSound(freq, duration = 0.1) {
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();

  oscillator.connect(gain);
  gain.connect(audio.destination);

  oscillator.frequency.value = freq;
  gain.gain.value = 0.08;

  oscillator.start();
  oscillator.stop(audio.currentTime + duration);
}
const size = 18;

let snake, food, dx, dy, score, timer, running;
  let level = 1;

let best = Number(localStorage.getItem("snakeBest")) || 0;
document.getElementById("best").textContent = "Best: " + best;

function startGame() {
  document.getElementById("startScreen").style.display = "none";
  
  clearInterval(timer);
  snake = [{x: 9, y: 9}];
  food = {x: 4, y: 4};
  dx = 1; dy = 0;
  score = 0;

  
  level = 1;
  running = true;
  paused = false;
  document.getElementById("score").textContent = "Score: 0";
  document.getElementById("level").textContent = "Level: 1";
  document.getElementById("message").textContent = "Collect the glowing food!";
  draw();
  timer = setInterval(update, Math.max(60, 140 - (level - 1) * 10));
}
  
let paused = false;

function pauseGame() {
  if (!running) return;

  paused = !paused;

  document.getElementById("message").textContent =
    paused ? "⏸ Game Paused" : "▶ Game Resumed";
}


function move(x, y) {
  if (x === -dx && y === -dy) return;
  dx = x; dy = y;
}

function update() {
  if (!running || paused) return;
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};

  if (head.x < 0 || head.x >= 20 ||
      head.y < 0 || head.y >= 20 ||
      snake.some(p => p.x === head.x && p.y === head.y)) {
    running = false;
    playSound(200, 0.3);
    clearInterval(timer);
    document.getElementById("message").textContent =
      "Game Over! Press Restart to play again.";
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    playSound(800);
    coins += 5;
  
document.getElementById("coins").textContent =
  "🪙 Coins: " + coins;
    playSound(800);
    level = Math.floor(score / 50) + 1;

document.getElementById("level").textContent =
  "Level: " + level;
    document.getElementById("score").textContent = "Score: " + score;
    if (score > best) {
  best = score;
  localStorage.setItem("snakeBest", best);
  document.getElementById("best").textContent = "Best: " + best;
      
      document.getElementById("coins").textContent = "🪙 Coins: " + coins;
    }
    food = {
      x: Math.floor(Math.random() * 20),
      y: Math.floor(Math.random() * 20)
    };
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.clearRect(0, 0, 360, 360);
  ctx.fillStyle = "#10182b";
  ctx.fillRect(0, 0, 360, 360);

  ctx.fillStyle = "#ff2878";
  ctx.shadowColor = "#ff2878";
  ctx.shadowBlur = 15;
  ctx.fillRect(food.x * size + 3, food.y * size + 3, 12, 12);

  ctx.fillStyle = "#00ffcc";
  ctx.shadowColor = "#00ffcc";
  ctx.shadowBlur = 12;
  snake.forEach(p => {
    ctx.fillRect(p.x * size + 2, p.y * size + 2, 14, 14);
  });
  ctx.shadowBlur = 0;
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowUp") move(0, -1);
  if (e.key === "ArrowDown") move(0, 1);
  if (e.key === "ArrowLeft") move(-1, 0);
  if (e.key === "ArrowRight") move(1, 0);
});
  
let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart", function(e) {
  touchStartX = e.changedTouches[0].clientX;
  touchStartY = e.changedTouches[0].clientY;
}, { passive: true });

canvas.addEventListener("touchend", function(e) {
  const diffX = e.changedTouches[0].clientX - touchStartX;
  const diffY = e.changedTouches[0].clientY - touchStartY;

  if (Math.abs(diffX) > Math.abs(diffY)) {
    if (diffX > 20) move(1, 0);
    else if (diffX < -20) move(-1, 0);
  } else {
    if (diffY > 20) move(0, 1);
    else if (diffY < -20) move(0, -1);
  }
}, { passive: true });

</script>
</body>
</html>
